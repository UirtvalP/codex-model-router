name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: >-
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('codex_model_router-*.whl')); assert len(wheels) == 1, wheels; subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheels[0])], check=True)"
      - run: codex-model-router --help
        working-directory: ${{ runner.temp }}
      - run: python -I -m codex_model_router --help
        working-directory: ${{ runner.temp }}
