[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-model-router"
dynamic = ["version"]
description = "A local-first model and reasoning router for Codex tasks and subagents."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Saadfk"}]
dependencies = []
keywords = ["codex", "model-routing", "agents", "hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
codex-model-router = "codex_model_router.cli:main"
codex-route = "codex_model_router.cli:main"
codex-router-dashboard = "codex_model_router.dashboard:main"

[project.urls]
Homepage = "https://github.com/UirtvalP/codex-model-router"
Repository = "https://github.com/UirtvalP/codex-model-router"
Issues = "https://github.com/UirtvalP/codex-model-router/issues"

[tool.setuptools]
packages = ["codex_model_router"]

[tool.setuptools.dynamic]
version = {attr = "codex_model_router.router.ROUTER_VERSION"}
